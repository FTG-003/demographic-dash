# =============================================================================
# Pipeline CI — Italian Demographic Observatory
# Sprint 4: Continuous Integration & Quality Gate
#
# Trigger: push e pull_request su main
# Jobs:
#   1. validate — Syntax check JS, validazione dataset, sync HTML ↔ JSON
# =============================================================================

name: Validate & Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validation & Quality Gate
    runs-on: ubuntu-latest

    steps:
      # ── Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Setup Node.js ──────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ── Setup Python 3.11 ─────────────────────────────────────────────────
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ── JS Syntax Check ───────────────────────────────────────────────────
      - name: JS Syntax Check
        run: for f in js/*.js; do node --check "$f"; done

      # ── Dataset Check ────────────────────────────────────────────────────
      - name: "[Dataset Check] python3 scripts/update_data.py --check"
        run: python3 scripts/update_data.py --check

      # ── Sync Check (dataset.json vs index.html) ──────────────────────────
      # Sync Check: embed dataset e verifica che index.html non differisca
      # (flag -b ignora differenze di soli spazi/righe vuote)
      - name: Sync Check (dataset.json vs index.html)
        run: |
          python3 scripts/update_data.py --embed
          git diff -b --exit-code index.html

      # ── Line Ending Check ─────────────────────────────────────────────────
      - name: Line Ending Check (must be LF only)
        run: |
          ! grep -rl $'\r$' index.html data/dataset.json js/*.js css/*.css 2>/dev/null || {
            echo '❌ CRLF trovato nei file sopra. Esegui: git add --renormalize . && git commit';
            exit 1;
          }
          echo '✅ Tutti i file hanno line endings LF'
