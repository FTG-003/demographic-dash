# =============================================================================
# Pipeline CI — Italian Demographic Observatory
# Sprint 4: Continuous Integration & Quality Gate
#
# Trigger: push e pull_request su main
# Jobs:
#   1. validate — Syntax check JS, validazione dataset, sync HTML ↔ JSON
# =============================================================================

name: Validate & Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validation & Quality Gate
    runs-on: ubuntu-latest

    steps:
      # ── Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Setup Node.js ──────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ── Setup Python 3.11 ─────────────────────────────────────────────────
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ── JS Syntax Check ───────────────────────────────────────────────────
      - name: "[JS Syntax Check] node --check js/*.js"
        run: node --check js/*.js

      # ── Dataset Check ────────────────────────────────────────────────────
      - name: "[Dataset Check] python3 scripts/update_data.py --check"
        run: python3 scripts/update_data.py --check

      # ── Sync Check (HTML ↔ JSON) ─────────────────────────────────────────
      - name: "[Sync Check] Embed dataset in index.html and verify git diff"
        run: |
          python3 scripts/update_data.py --embed
          git diff --exit-code index.html
